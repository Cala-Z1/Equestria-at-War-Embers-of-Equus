l_english:
  CRY_Cadence:0 "Princess Cadance"
  CRY_Cadence_desc:0 "Once an orphaned pegasus filly, Princess Cadance ascended to alicornhood through her extraordinary gift for spreading love and harmony, earning the trust of Princess Celestia and becoming her adopted niece. Following her marriage to Prince Shining Armor, she assumed the throne of the Crystal Empire, where her compassion and unwavering resolve restored a nation long thought lost to history. Though renowned for her kindness and gentle spirit, Cadance is no stranger to hardship. She has stood against dark sorcery, defended her kingdom from invasion, and endured trials that would have broken lesser rulers. Her greatest strength lies not in conquest, but in her ability to unite those around her, inspiring loyalty through hope rather than fear. As ruler of the Crystal Empire, Princess Cadance seeks to preserve peace while safeguarding her people against the growing dangers of the world. Whether through diplomacy, determination, or, when necessary, the strength of the Crystal Heart and the Empire's defenders, she remains committed to ensuring that harmony endures for generations to come."