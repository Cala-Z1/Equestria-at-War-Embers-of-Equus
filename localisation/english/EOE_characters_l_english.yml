 CRY_Cadence:0 "Princess Mi Amore Cadenza"
 POLITICS_CADENZA_DESC:0 "§YBorn§!: 14th of February 972, near Vanhoover\n\n§YBiography§!: Princess Cadance's humble origins belie her future as one of the royal alicorns of Equestria. The pegasus foal, who would later become known as Princess Mi Amore Cadenza, was found in a forest close to Vanhoover by her earth pony adopted parents. Taken to a nearby village, it was a peaceful, calm life until one day, a jealous sorceress named Prismia stole the love of the villagers using a malevolent magical necklace. The young Cadance confronted Prismia and turned her own magic against her, causing her to change her horrible ways. Afterward, Princess Celestia recognised her power, adopted her as her niece and elevated Cadance as the alicorn Princess of Love.\n\nThereafter, Cadance became a foalsitter for Princess Celestia's newest personal student, Twilight Sparkle. She would meet and fall in love with Twilight's older brother, Shining Armour. Their wedding day was going to be perfect, but unfortunately, the scheming Chrysalis, Queen of the Changelings used the opportunity to impersonate Cadance and seize control of Equestria by guile. Despite the presence of a large changeling host and their empowered Queen, Princess Cadance and Shining Armour used the power of their love to cast the changelings out of the country.\n\nWhen the Crystal Empire reappeared, Celestia sent Cadance to rule over it, knowing her to be a descendant of Princess Amore, its last ruler before Sombra's reign. Cadance made her stand there, defeating the nascent shadow of King Sombra that lingered after his banishment by using a mythical artefact called the Crystal Heart. With their success, she and Shining Armour have safekept the land ever since, siring a foal named Flurry Heart along the way"
 CRY_Shining_Armor: "Shining Armor"
