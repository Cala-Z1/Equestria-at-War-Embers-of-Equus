 ## Unit names ##
 volkssturm_infantry:0 "Light Infantry"
 volkssturm_infantry_desc:0 "Fast-moving infantry suited to a wide range of terrain."
 garrison:0 "Garrison"
 garrison_desc:0 "Defensive infantry specialised in holding ground and suppressing resistance."

 EOE_EVERYTHING:0 "Embers of Equus"
 EOE_EVERYTHING_DESC:0 "The full world of Equus and Griffonia. Both continents are active and ready for conflict."
 EOE_EQUUS_ONLY:0 "Equus Only"
 EOE_EQUUS_ONLY_DESC:0 "A scenario focused on the continent of Equus. Griffonia lies silent and unclaimed beyond the horizon."
 EOE_GRIFFONIA_ONLY:0 "Griffonia Only"
 EOE_GRIFFONIA_ONLY_DESC:0 "A scenario focused on the Griffonian continent. Equus is empty, its nations dissolved into the void."


 # ── Heavy Anti-Air ───────────────────────────────────────────────────────────
 heavy_antiair:0 "Heavy Anti-Air Artillery"
 heavy_antiair_desc:0 "Large-calibre anti-air guns capable of engaging high-altitude bombers and providing ground-based air defence for key installations."
 heavy_antiair_1:0 "Semi-Automatic Breech Mechanism"
 heavy_antiair_1_desc:0 "Improved loading mechanisms increase the rate of fire of heavy anti-air batteries, boosting both air attack and suppression capability."
 heavy_antiair_2:0 "Improved Heavy Anti-Air"
 heavy_antiair_2_desc:0 "Second-generation heavy anti-air guns with greater elevation range and improved fuse technology."
 heavy_antiair_5:0 "Advanced Heavy Anti-Air"
 heavy_antiair_5_desc:0 "State-of-the-art heavy anti-air batteries capable of engaging the fastest and highest-flying aircraft."

 # ── Pack Artillery ───────────────────────────────────────────────────────────
 gw_pack_artillery:0 "Pack Artillery"
 gw_pack_artillery_desc:0 "Light howitzers and guns designed to be broken down and carried by pack animals, giving infantry support firepower in terrain where wheels cannot go."
 pack_artillery1:0 "Improved Pack Artillery"
 pack_artillery1_desc:0 "Refinements in barrel and carriage design improve the weight-to-firepower ratio of pack guns without sacrificing portability."
 pack_artillery_mot:0 "Motorized Pack Artillery"
 pack_artillery_mot_desc:0 "Attaching light transport vehicles to pack artillery brigades improves their mobility on roads while retaining cross-terrain capability."
 pack_artillery4:0 "Modern Pack Artillery"
 pack_artillery4_desc:0 "Purpose-built lightweight guns with modern metallurgy, delivering significantly increased shell weight from a still-portable platform."

 # ── Mountain Artillery ───────────────────────────────────────────────────────
 pack_artillery_m_1:0 "Mountain Gun"
 pack_artillery_m_1_desc:0 "Specialised artillery designed for high-altitude warfare, breaking down into loads that soldiers or mules can carry over steep terrain."
 pack_artillery_m_2_1:0 "Lightweight Mountain Gun"
 pack_artillery_m_2_1_desc:0 "A lighter mountain gun variant prioritising ease of transport, using special alloys and a shorter barrel to reduce weight while maintaining accuracy."
 pack_artillery_m_2_1_tt:0 "Reduces equipment requirements for mountain gun brigades and improves their defensive capability in rough terrain."
 pack_artillery_m_2_2:0 "High-Charge Mountain Gun"
 pack_artillery_m_2_2_desc:0 "A heavier-charged mountain gun variant trading portability for significantly increased shell velocity and anti-fortification capability."
 pack_artillery_m_2_2_tt:0 "Increases soft attack of mountain gun brigades at the cost of additional special equipment."
 pack_artillery_m_3:0 "Paradrop Mountain Artillery"
 pack_artillery_m_3_desc:0 "Ultra-lightweight mountain guns that can be air-dropped alongside paratroopers, giving airborne forces their own organic artillery support."
 pack_artillery_m_3_tt:0 "Mountain gun brigades can now be deployed via paradrop, and reduce their special equipment requirement."

 # ── Field Guns ───────────────────────────────────────────────────────────────
 field_gun:0 "Field Gun"
 field_gun_desc:0 "Direct-fire artillery pieces optimised for engaging enemy infantry and vehicles on a flat trajectory, complementing howitzers in a combined-arms battery."
 field_gun_mot:0 "Motorized Field Gun"
 field_gun_mot_desc:0 "Towing field guns with motor vehicles dramatically improves their strategic mobility, allowing artillery to keep pace with armoured advances."

 # ── Standard Artillery ───────────────────────────────────────────────────────
 artillery1:0 "Interwar Artillery"
 artillery1_desc:0 "Refinements to Great War howitzer designs, improving range and shell weight while reducing crew requirements."
 artillery2:0 "Early War Artillery"
 artillery2_desc:0 "Purpose-designed artillery benefiting from interwar metallurgical advances, with longer barrels and improved propellant charges."
 artillery3:0 "Mid-War Artillery"
 artillery3_desc:0 "Artillery systems incorporating lessons from early campaign experience, improving rate of fire, shell consistency, and crew survivability."
 artillery4:0 "Late War Artillery"
 artillery4_desc:0 "Advanced artillery with increased chamber pressure tolerances and improved fire control, maximising range and lethality."
 artillery5_1:0 "Heavy Barrel Artillery"
 artillery5_1_desc:0 "Longer, heavier barrels deliver greater shell velocity and range, at the cost of reduced mobility and a heavier carriage."
 artillery5_2:0 "Lightweight Artillery"
 artillery5_2_desc:0 "Sacrificing some range for improved mobility, these lighter guns can keep pace with faster-moving formations."
 artillery7_1:0 "Self-Propelled Artillery I"
 artillery7_1_desc:0 "Mounting artillery pieces on tracked hulls eliminates the need for separate towing vehicles and allows fire from positions impossible for towed guns."
 artillery7_2:0 "Self-Propelled Artillery II"
 artillery7_2_desc:0 "Second-generation self-propelled guns with improved armour protection for the crew and greater ammunition stowage."
 artillery8_1:0 "Advanced Self-Propelled Artillery I"
 artillery8_1_desc:0 "Fully enclosed self-propelled artillery systems with gun stabilisation and onboard fire control computers."
 artillery8_2:0 "Advanced Self-Propelled Artillery II"
 artillery8_2_desc:0 "State-of-the-art self-propelled artillery with extended range, improved crew protection, and rapid deployment capability."

 # ── Heavy Artillery ──────────────────────────────────────────────────────────
 heavy_artillery1:0 "Heavy Artillery"
 heavy_artillery1_desc:0 "Large-calibre guns and howitzers for reducing fortifications and delivering deep fire support beyond the range of field artillery."
 heavy_artillery2:0 "Improved Heavy Artillery"
 heavy_artillery2_desc:0 "Second-generation heavy guns with improved breech mechanisms and propellant charges, increasing range and shell weight."
 heavy_artillery3_1:0 "Heavy Artillery — Long Range"
 heavy_artillery3_1_desc:0 "Extended-barrel heavy guns maximising range at the cost of barrel wear and reduced mobility."
 heavy_artillery3_2:0 "Heavy Artillery — High Explosive"
 heavy_artillery3_2_desc:0 "Improved shell filling and fuse designs dramatically increase the destructive effect of heavy artillery bombardments."
 heavy_artillery5_1:0 "Modern Heavy Artillery"
 heavy_artillery5_1_desc:0 "Contemporary heavy artillery designs incorporating lessons from sieges and breakthrough battles."
 heavy_artillery6_1:0 "Super-Heavy Artillery I"
 heavy_artillery6_1_desc:0 "Enormous railway or emplaced guns capable of destroying the most heavily reinforced bunkers and coastal fortifications."
 heavy_artillery6_2:0 "Super-Heavy Artillery II"
 heavy_artillery6_2_desc:0 "Further refinements to super-heavy gun design, improving accuracy and rate of fire for these titanic weapons."
 heavy_artillery7:0 "Ultra-Heavy Artillery"
 heavy_artillery7_desc:0 "The largest practical land-based guns, firing shells of immense weight capable of penetrating the deepest underground fortifications."

 # ── Siege Artillery ──────────────────────────────────────────────────────────
 siege_artillery1:0 "Siege Artillery"
 siege_artillery1_desc:0 "Specialised heavy guns designed to reduce permanent fortifications, firing plunging trajectories to penetrate reinforced roofs and ceilings."
 siege_artillery2:0 "Improved Siege Artillery"
 siege_artillery2_desc:0 "Second-generation siege guns with increased calibre and improved armour-piercing shell designs."
 siege_artillery3:0 "Advanced Siege Artillery"
 siege_artillery3_desc:0 "Modern siege artillery with improved mobility systems allowing faster emplacement and displacement between targets."
 siege_artillery4_1:0 "Siege Artillery — Penetration Focus"
 siege_artillery4_1_desc:0 "Specialised shells with hardened tips and delayed fuses designed to penetrate deep into reinforced concrete before detonating."
 siege_artillery4_2:0 "Siege Artillery — Blast Focus"
 siege_artillery4_2_desc:0 "High-capacity shells maximising blast overpressure within enclosed fortification spaces."
 siege_artillery5_1:0 "Modern Siege Artillery I"
 siege_artillery5_1_desc:0 "Contemporary siege guns benefiting from improved metallurgy and propellant chemistry."
 siege_artillery5_2:0 "Modern Siege Artillery II"
 siege_artillery5_2_desc:0 "Further improvements to siege gun design incorporating guided shell technology."
 siege_artillery6:0 "Ultimate Siege Artillery"
 siege_artillery6_desc:0 "The pinnacle of conventional siege artillery, capable of reducing any fixed fortification known to exist."

 # ── Rocket Artillery ─────────────────────────────────────────────────────────
 rocket_artillery:0 "Rocket Artillery"
 rocket_artillery_desc:0 "Multiple-launch rocket systems delivering saturation fire across wide areas, trading accuracy for tremendous volume of fire."
 rocket_artillery3:0 "Improved Rocket Artillery"
 rocket_artillery3_desc:0 "Improved propellant and guidance systems increase the accuracy and range of rocket artillery batteries."
 rocket_artillery4:0 "Advanced Rocket Artillery"
 rocket_artillery4_desc:0 "Modern rocket artillery with improved accuracy, faster reload, and self-propelled carriages."
 rocket_artillery_fin:0 "Fin-Stabilised Rockets"
 rocket_artillery_fin_desc:0 "Fin-stabilised rocket designs eliminate the need for barrel rifling, reducing weight while improving accuracy at longer ranges."
 rocket_artillery_spin:0 "Spin-Stabilised Rockets"
 rocket_artillery_spin_desc:0 "Spin-stabilised rocket designs provide greater accuracy at shorter ranges and improve terminal effectiveness."
 motorized_rocket_unit:0 "Motorized Rocket Unit"
 motorized_rocket_unit_desc:0 "Mounting rocket launchers on motor vehicles creates highly mobile fire-support platforms that can rapidly reposition after firing."
 motorized_rocket_support:0 "Rocket Artillery Support Vehicle"
 motorized_rocket_support_desc:0 "Dedicated ammunition carriers and fire control vehicles accompanying rocket units, dramatically improving sustained rate of fire."

 # ── Anti-Tank ────────────────────────────────────────────────────────────────
 interwar_antitank:0 "Anti-Tank Gun"
 interwar_antitank_desc:0 "Purpose-built low-silhouette guns firing high-velocity shells designed to penetrate armour plate, giving infantry a dedicated counter to armoured vehicles."
 at_line_mot:0 "Motorized Anti-Tank"
 at_line_mot_desc:0 "Towing anti-tank guns behind motor vehicles allows them to redeploy rapidly in response to armoured breakthroughs."
 at_line_mot_tt:0 "Anti-tank brigades now require motorized equipment but gain improved mobility and combat performance."
 antitank4:0 "Improved Anti-Tank Gun"
 antitank4_desc:0 "Higher-pressure chambers and improved shell design dramatically increase penetration capability against increasingly thick armour."
 antitank5_1:0 "Heavy Anti-Tank Gun"
 antitank5_1_desc:0 "Large-calibre anti-tank guns capable of defeating any known armour, though their weight limits mobility in difficult terrain."
 antitank5_2:0 "High-Velocity Anti-Tank Gun"
 antitank5_2_desc:0 "Extremely high-velocity guns trading calibre for penetration, maintaining greater mobility than heavier alternatives."
 antitank6_1:0 "Modern Anti-Tank Gun"
 antitank6_1_desc:0 "State-of-the-art anti-tank guns incorporating composite armour penetrators and improved fire control systems."

 # ── Anti-Air ─────────────────────────────────────────────────────────────────
 interwar_antiair:0 "Anti-Aircraft Gun"
 interwar_antiair_desc:0 "Light to medium automatic cannon designed to engage low-flying aircraft, providing point defence for infantry formations and key installations."
 anti_air_moto:0 "Motorized Anti-Aircraft"
 anti_air_moto_desc:0 "Mounting anti-aircraft guns on motor vehicles creates mobile air-defence platforms that can accompany advancing formations."
 antiairmot_tt:0 "Anti-air brigades now require motorized equipment but gain improved mobility and air attack."
 antiair3:0 "Improved Anti-Aircraft Gun"
 antiair3_desc:0 "Higher-velocity guns with improved fire control systems increase the effective engagement ceiling and probability of kill."
 antiair4:0 "Fire Control Anti-Aircraft"
 antiair4_desc:0 "Radar-assisted or optical fire control directors dramatically improve first-round hit probability for both light and heavy anti-aircraft batteries."
 antiairfc:0 "Advanced Fire Control"
 antiairfc_desc:0 "Computerised fire control and predictive fuzing bring anti-aircraft gunnery to near-automatic effectiveness against conventional aircraft."
 antiair5:0 "Advanced Anti-Aircraft Gun"
 antiair5_desc:0 "The most capable conventional anti-aircraft artillery, capable of engaging jet-speed targets at high altitude."

 # ── Mountain Gun (hidden focus tech) ─────────────────────────────────────────
 mountain_gun:0 "Mountain Gun Doctrine"
 mountain_gun_desc:0 "Specialised doctrine and equipment adaptations allowing standard artillery to operate effectively in extreme alpine terrain."

 # ── Tooltip strings ───────────────────────────────────────────────────────────
 infgunmot_tt:0 "Pack artillery brigades now require motorized equipment but gain improved mobility and combat bonuses."
 antitank1_tt:0 "Anti-tank brigades now require motorized equipment but gain improved fuel capacity and combat performance."
 antiairmot_tt:0 "Anti-air brigades now require motorized equipment but gain improved fuel capacity and air attack."
 expensive_anti_tank_license:0 "Procuring these advanced anti-tank guns requires significant industrial investment and foreign licensing agreements."
