 CRY_1007_1_1:0 "The Crystal Empire is a new nation in the world stage. Long ago, it had disappeared following the defeat of the evil tyrant, King Sombra, who had cast a curse on it. The Empire reappeared only recently, as did Sombra, but it was ultimately freed with aid from Equestria. Now under the rule of the Equestrian princess, Mi Amore Cadenza, many wonder how the Crystal Empire will proceed in these troubled times. Will the Crystal Ponies stay loyal to Equestria, or will darkness return once more?"