# ── CRY COUNTRY IDEAS ────────────────────────────────────────────────────────────

 equestrian_overlord:0 "Under Equestrian Oversight"
 equestrian_overlord_desc:0 "The Crystal Empire exists under the watchful eye of Equestria. While Canterlot's protection is welcome, its constant interference in our affairs stifles our political development, slows our research, and undermines the confidence of our ponies. We are a sovereign nation — or so we tell ourselves."
 
 crystal_buff:0 "Children of the Crystal North"
 crystal_buff_desc:0 "Crystal Ponies are born and bred in the harshest climate on Equus. Generations of surviving bitter winters and Sombra's brutal rule have forged them into something extraordinary — resilient, disciplined, and deeply familiar with how to hold ground and make do with less."
 
 CRY_five_year_plan:0 "The Five Year Plan"
 CRY_five_year_plan_desc:0 "The Crystal Empire commits to a sweeping programme of civilian industrial expansion. Factories, workshops, and infrastructure projects are prioritised above all else — including military production. It will be years before the full benefits are felt, but the foundations being laid now will transform the Empire's economic capacity."
 
 closed_market:0 "Closed Crystal Market"
 closed_market_desc:0 "The Crystal Empire restricts foreign access to its markets and resources. What we mine, we keep. What we produce, we consume. It is an isolationist policy that limits trade income, but it ensures that the Empire's precious crystal resources remain in crystal hooves — and out of the grasp of outside powers."