 equestrian_overlord:0 "Under Equestrian Oversight"
 equestrian_overlord_desc:0 "The Crystal Empire exists under the watchful eye of Equestria. While Canterlot's protection is welcome, its constant interference in our affairs stifles our political development, slows our research, and undermines the confidence of our ponies. We are a sovereign nation — or so we tell ourselves."
