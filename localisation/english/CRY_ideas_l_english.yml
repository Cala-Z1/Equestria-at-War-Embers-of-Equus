 CRY_sombra_cooldown:0 "Root Out The Shadow's Agents"
 crystal_buff_desc:0 "Crystal Ponies are born and bred in the harshest climate on Equus. Generations of surviving bitter winters and Sombra's brutal rule have forged them into something extraordinary — resilient, disciplined, and deeply familiar with how to hold ground and make do with less."
 CRY_five_year_plan:0 "The Five Year Plan"
 CRY_five_year_plan_desc:0 " Military Factories Construction Speed = [?CRY_production_speed_arms_factory_factor_variable|%+=0] \n Civilian Factory Construction Speed = [?CRY_production_speed_industrial_complex_factor_variable|%+=0] \n Consumer Goods Expected = [?CRY_five_year_plan_consumer_goods_expected_value_variable|%+=0] \n Research Speed = [?CRY_research_speed_factor_variable|%+=0] \n The Crystal Empire commits to a sweeping programme of civilian industrial expansion. Factories, workshops, and infrastructure projects are prioritised above all else — including military production. It will be years before the full benefits are felt, but the foundations being laid now will transform the Empire's economic capacity."
 closed_market:0 "Closed Crystal Market"
 closed_market_desc:0 "The Crystal Empire restricts foreign access to its markets and resources. What we mine, we keep. What we produce, we consume. It is an isolationist policy that limits trade income, but it ensures that the Empire's precious crystal resources remain in crystal hooves — and out of the grasp of outside powers."
