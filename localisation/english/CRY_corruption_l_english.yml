 # ── System UI ────────────────────────────────────────────────────────────────
 CRY_corruption_panel_title:0 "Sombra's Influence"
 CRY_crisis_value_text:0 "bShadow Corruption: §R[?CRY_crisis_level]§!!"
 CRY_crisis_description_text:0 "[?CRY.CRY_new_deal_help|G0] Total Relief Efforts"
 CRY_crisis_management_system_cat:0 "Sombra's Influence"
 CRY_crisis_management_system_cat_desc:0 "The Crystal Heart's warmth does not reach every corner of the Empire on its own. We must actively carry its light outward — through public ceremonies, community gatherings, and the simple act of crystal ponies telling each other that the dark days are truly over. Hope is a weapon. We must use it."
 # ── Corruption thresholds ────────────────────────────────────────────────────
 CRY_crisis_1_tt:0 "§GWhispers of the Shadow§!\nRumors of Sombra's return have begun to circulate among the Crystal Ponies. Most dismiss them as nothing more than old fears, but the memories of his reign still linger beneath the surface.\n§CThe Crystal Heart§! \nWar Support: §G+50%§!"
 CRY_crisis_2_tt:0 "§GUneasy Memories§!\nThe possibility of Sombra's return has become harder to ignore. Stories of his past atrocities have begun resurfacing, leaving many Crystal Ponies increasingly uneasy about what may lie ahead.\n§CThe Crystal Heart§! \nWar Support: §G+45%§!"
 CRY_crisis_3_tt:0 "§GA Shadow Approaches§!\nReports suggest that Sombra is moving closer to the Crystal Empire. His name is spoken more frequently, and the Crystal Ponies are beginning to fear that the horrors of the past may return. \n§CThe Crystal Heart§! \nWar Support: §G+40%§!"
 CRY_crisis_4_tt:0 "§WGrowing Dread§!\nSombra draws closer with every passing day. Fear is spreading through Crystal society, and memories of his rule are beginning to overshadow the happiness that once defined the Crystal Empire.\n§CThe Crystal Heart§! \nWar Support: §G+35%§!"
 CRY_crisis_5_tt:0 "§WFear of His Return§!\nThere is little doubt now that Sombra is approaching. Crystal Ponies have begun preparing for the worst, while many struggle to suppress memories of the suffering they endured under his rule.\n§CThe Crystal Heart§! \nWar Support: §G+30%§!"
 CRY_crisis_6_tt:0 "§WThe Shadow at the Gates§!\nSombra's presence can almost be felt within the Empire. Fear has become a constant companion for many Crystal Ponies, and confidence in their ability to withstand another invasion is beginning to disappear.\n§CThe Crystal Heart§! \nWar Support: §G+25%§!"
 CRY_crisis_7_tt:0 "§WMemories of Darkness§!\nThe approach of Sombra has awakened memories that many Crystal Ponies had tried to forget. The Empire is becoming increasingly somber as fear and hopelessness spread from one community to another.\n§CThe Crystal Heart§! \nWar Support: §G+20%§!"
 CRY_crisis_8_tt:0 "§RSombra's Shadow§!\nThe Crystal Empire stands beneath the shadow of its former tyrant once again. Sombra is dangerously close, and many Crystal Ponies have begun to believe that another age of darkness is inevitable.\n§CThe Crystal Heart§! \nWar Support: §G+15%§!\nStability: §R-10%§!"
 CRY_crisis_9_tt:0 "§RThe Coming Darkness§!\nSombra is nearly upon the Crystal Empire. Panic has replaced confidence, and the Crystal Ponies are struggling to find any reason to believe that their home can survive what is coming.\n§CThe Crystal Heart§! \nWar Support: §G+10%§!\nStability: §R-15%§!\nDaily Political Power Gain: §R-0.10§!"
 CRY_crisis_10_tt:0 "§RCrushed by Despair§!\nSombra's return is imminent. The Crystal Ponies are consumed by fear and despair, with many convinced that the Empire will once again fall beneath the shadow of its former master.\n§CThe Crystal Heart§! \nWar Support: §G+5%§!\nStability: §R-20%§!\nDaily Political Power Gain: §R-0.20§!" 
 # ── Decision names ───────────────────────────────────────────────────────────
 CRY_crystal_faire_celebration:0 "Host the Crystal Fair"
 CRY_crystal_faire_celebration_desc:0 "The Crystal Fair is the heart of Equestrian culture — a festival of joy, light, and unity that has powered the Crystal Heart for centuries. Organizing a grand celebration will strengthen the ponies' connection to the Heart and drive back Sombra's shadows.\n\n§WReduces §Ycorruption level§! §Wby: §G10! Gpoints!"
 CRY_spread_crystal_love:0 "Spread the Crystal Heart's Light"
 CRY_spread_crystal_love_desc:0 "Deploy teams of crystal ponies across the Empire to share the Heart's love and warmth with communities still living under the shadow of Sombra's memory. Education, culture, and fellowship are our weapons against the darkness.\n\n§YReduces corruption by §G5§Y points§!\n§YRequires: §WStability above 50%§!\n§YCooldown: §W60 days§!"
 CRY_empower_crystal_heart:0 "Empower the Crystal Heart"
 CRY_empower_crystal_heart_desc:0 "Channel the full magical resources of the Empire to amplify the Crystal Heart's power. This is costly and demanding, but nothing strikes back the shadow more effectively.\n\n§YReduces corruption by §G15§Y points§!\n§YRequires: §WCrystal research, Stability above 60%§!\n§YCooldown: §W120 days§!"
