 CRY_panel_title_loc:0 "Crystal Heart Monitor"
 CRY_active_effects_label:0 "Active Effects"
 CRY_corruption_value_text:0 "Corruption:"
 CRY_stability_penalty_label:0 "§RStability, War Support, Production\nand Conscription reduced\nby corruption level§!"